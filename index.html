<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial42 — Coming Soon</title>
    
    <!-- Font moderno Inter e FontAwesome per l'icona LinkedIn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-yellow: #EBF950;
            --text-main: #ffffff;
            --text-muted: #a0a5b5;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Sfondo dinamico con bagliore sottile */
        .glow-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(235, 249, 80, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 540px;
            width: 90%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-wrapper {
            margin-bottom: 2rem;
            display: inline-block;
        }

        .logo-wrapper img {
            max-width: 180px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(235, 249, 80, 0.2));
            transition: transform 0.3s ease;
        }

        .logo-wrapper img:hover {
            transform: scale(1.03);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(235, 249, 80, 0.1);
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(235, 249, 80, 0.3);
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-yellow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-yellow);
            animation: pulse 1.8s infinite;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 0.75rem;
            line-height: 1.1;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-linkedin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-yellow);
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(235, 249, 80, 0.3);
        }

        .btn-linkedin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(235, 249, 80, 0.5);
            background-color: #f4ff6b;
        }

        .btn-linkedin i {
            font-size: 1.2rem;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <main class="container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="logo.png" alt="Industrial42 Logo">
        </div>

        <!-- Tag "SOON" -->
        <div>
            <span class="badge">
                <span class="dot"></span>
                Coming Soon
            </span>
        </div>

        <h1>SOON</h1>
        <p>We are coming</p>

        <!-- Bottone LinkedIn -->
        <!-- SOSTITUISCI IL LINK QUI SOTTO CON IL TUO URL LINKEDIN -->
        <a href="https://www.linkedin.com/company/industrial42/" target="_blank" rel="noopener noreferrer" class="btn-linkedin">
            <i class="fa-brands fa-linkedin"></i>
            Seguici su LinkedIn
        </a>
    </main>

</body>
</html>
